<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bothors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Barre du haut : marque, état de la connexion au bot, compte -->
  <header class="topbar">
    <a class="brand" href="#/accueil"><span class="brand-logo">B</span>Bot<em>hors</em><small>v2.0</small></a>
    <div class="topbar-right">
      <span id="ws-status" class="pill pill-ok" title="Connexion entre cette page et ton bot"><i class="dot"></i><span>Connecté</span></span>
      <span id="top-proxies" class="pill" title="Proxies prêts / en jeu"></span>
      <span class="sep"></span>
      <span class="who" id="top-user"></span>
      <button class="btn-ghost sm" id="btn-logout" data-icon="logout">Déconnexion</button>
      <button class="icon-btn" id="btn-help" title="Aide : à quoi sert chaque page" data-icon="help"></button>
      <button class="icon-btn" id="btn-theme" title="Thème clair / sombre"></button>
    </div>
  </header>

  <!-- Navigation principale -->
  <nav class="mainnav" id="mainnav"></nav>

  <!-- Bandeau d'alerte global (session coupée, licence, etc.) -->
  <div id="banner" class="banner" hidden></div>

  <div class="layout">
    <!-- Colonne des sessions (personnages connectés), regroupées par groupe -->
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content" id="view"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toasts"></div>

  <script src="js/icons.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/bot.js"></script>
  <script src="js/views/accounts.js"></script>
  <script src="js/views/proxies.js"></script>
  <script src="js/views/groups.js"></script>
  <script src="js/views/scripts.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/stats.js"></script>
  <script src="js/views/agent.js"></script>
  <script src="js/views/hdv.js"></script>
  <script src="js/views/calc.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
